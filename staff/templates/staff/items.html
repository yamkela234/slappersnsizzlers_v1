{% extends "staff/base.html" %}

{% block content %}
<section class="adm-card adm-card--flush">
	<div class="adm-card-head">
		<h2 class="adm-h2">Menu items</h2>
		<span class="adm-hint">Price and availability edit in place — no page load.</span>
	</div>
	<div class="adm-table-wrap">
		<table class="adm-table">
			<thead>
				<tr>
					<th>Dish</th><th>Category</th><th>Price</th><th>Prep</th><th>On the menu</th><th></th>
				</tr>
			</thead>
			<tbody>
				{% for row in rows %}
				{% include "staff/_item_row.html" with item=row.item sold=row.sold %}
				{% endfor %}
			</tbody>
		</table>
	</div>
</section>
{% endblock content %}
