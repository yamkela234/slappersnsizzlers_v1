databases:
  - name: slappersnsizzlers-db
    databaseName: slappersnsizzlers
    user: slappersnsizzlers
    plan: free

services:
  - type: web
    name: slappersnsizzlers
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn slappersnsizzlers_v1.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: slappersnsizzlers-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "slappersnsizzlers.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://slappersnsizzlers.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
